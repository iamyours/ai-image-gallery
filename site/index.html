<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 图片作品集</title>
  <meta name="description" content="AI 生成图片作品展示，附完整提示词。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🖼️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>AI 图片作品集</h1>
      <p class="sub">每件作品都附带提示词，点开即可复制。</p>
      <div class="controls">
        <input id="search" type="search" placeholder="搜索标题、提示词、模型…" aria-label="搜索">
        <span id="count" class="count"></span>
      </div>
      <nav id="tags" class="tags" aria-label="标签筛选"></nav>
    </div>
  </header>

  <main class="wrap">
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>没有找到匹配的作品。</p>
  </main>

  <footer class="wrap foot">
    数据接口：<a href="works.json">works.json</a> · 托管于 GitHub Pages
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <div id="lb-stage" class="lb-stage">
      <div id="lb-canvas" class="lb-canvas">
        <img id="lb-preview" class="lb-img lb-preview" alt="" aria-hidden="true" draggable="false">
        <img id="lb-img" class="lb-img lb-full" alt="" decoding="async" draggable="false">
      </div>
      <div id="lb-loading" class="lb-loading" role="status">
        <span class="lb-spinner" aria-hidden="true"></span>
        <span>正在加载原图…</span>
      </div>
      <button type="button" id="lb-prev" class="lb-arrow lb-prev" aria-label="上一张图片">‹</button>
      <button type="button" id="lb-next" class="lb-arrow lb-next" aria-label="下一张图片">›</button>
    </div>

    <button type="button" id="lb-close" class="lb-close" aria-label="关闭">×</button>

    <div class="lb-bottom" id="lb-bottom">
      <div class="lb-head">
        <h2 id="lb-title"></h2>
        <span id="lb-counter" class="lb-counter" aria-live="polite"></span>
      </div>
      <p id="lb-meta" class="lb-meta"></p>
      <div class="lb-tools">
        <a id="lb-open" class="lb-open" href="#" target="_blank" rel="noopener">查看原图 ↗</a>
        <button type="button" id="lb-copy" class="lb-copy">复制提示词</button>
        <button type="button" id="lb-prompt-toggle" class="lb-toggle" aria-expanded="false" aria-controls="lb-prompt-panel">
          提示词 <span class="lb-chev" aria-hidden="true">⌄</span>
        </button>
      </div>
      <div id="lb-prompt-panel" class="lb-prompt-panel" hidden>
        <pre id="lb-prompt" class="lb-prompt"></pre>
        <div id="lb-neg-wrap" hidden>
          <h3 class="lb-neg-title">反向提示词</h3>
          <pre id="lb-neg" class="lb-prompt lb-neg"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
