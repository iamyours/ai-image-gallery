<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <title>AI 图片作品集</title>
  <meta name="description" content="AI 生成图片作品展示，附完整提示词。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🖼️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <h1>AI 图片作品集</h1>
        <p class="sub">每件作品都附带完整提示词，点开即可查看与复制。</p>
      </div>
      <span id="total" class="total" aria-live="polite"></span>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="wrap toolbar-inner">
      <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="搜索标题、提示词、标签…" aria-label="搜索" autocomplete="off" enterkeyhint="search">
        </label>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <nav id="tags" class="tags" aria-label="标签筛选"></nav>
    </div>
  </div>

  <main class="wrap">
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>没有找到匹配的作品。</p>
  </main>

  <footer class="wrap foot">
    数据接口：<a href="works.json">works.json</a> · 托管于 GitHub Pages
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <div id="lb-stage" class="lb-stage">
      <div id="lb-canvas" class="lb-canvas">
        <img id="lb-preview" class="lb-img lb-preview" alt="" aria-hidden="true" draggable="false">
        <img id="lb-img" class="lb-img lb-full" alt="" decoding="async" draggable="false">
      </div>
      <div id="lb-loading" class="lb-loading" role="status" hidden>
        <span class="lb-spinner" aria-hidden="true"></span>
        <span>正在加载原图…</span>
      </div>
      <button type="button" id="lb-prev" class="lb-arrow lb-prev" aria-label="上一张图片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <button type="button" id="lb-next" class="lb-arrow lb-next" aria-label="下一张图片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <div class="lb-topbar">
        <span id="lb-counter" class="lb-counter" aria-live="polite"></span>
        <button type="button" id="lb-close" class="lb-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>

    <aside class="lb-sheet" id="lb-bottom">
      <button type="button" class="lb-grabber" id="lb-grabber" aria-label="展开或收起提示词" tabindex="-1"><span></span></button>
      <div class="lb-head">
        <h2 id="lb-title"></h2>
        <p id="lb-meta" class="lb-meta"></p>
        <div id="lb-tags" class="lb-tags"></div>
      </div>
      <div class="lb-tools">
        <button type="button" id="lb-prompt-toggle" class="btn lb-toggle" aria-expanded="false" aria-controls="lb-prompt-panel">
          <span class="lb-toggle-label"><span class="lg">展开提示词</span><span class="sm">提示词</span></span>
          <svg class="lb-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button type="button" id="lb-copy" class="btn btn-primary lb-copy"><span class="lg">复制提示词</span><span class="sm">复制</span></button>
        <a id="lb-open" class="btn lb-open" href="#" target="_blank" rel="noopener"><span class="lg">查看原图</span><span class="sm">原图</span> ↗</a>
        <a id="lb-source" class="btn lb-source" href="#" target="_blank" rel="noopener" hidden><span class="lg">X 原帖</span><span class="sm">原帖</span> ↗</a>
      </div>
      <section id="lb-originals" class="lb-originals" aria-labelledby="lb-orig-title" hidden>
        <h3 id="lb-orig-title" class="lb-sec-title">X 原图</h3>
        <div id="lb-orig-row" class="lb-orig-row"></div>
        <p id="lb-orig-credit" class="lb-orig-credit"></p>
      </section>
      <div id="lb-prompt-panel" class="lb-prompt-panel">
        <h3 class="lb-sec-title">提示词</h3>
        <pre id="lb-prompt" class="lb-prompt"></pre>
        <div id="lb-neg-wrap" hidden>
          <h3 class="lb-sec-title">反向提示词</h3>
          <pre id="lb-neg" class="lb-prompt lb-neg"></pre>
        </div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
